<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arasta">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a33">
<title>Arasta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, sıcak, el yapımı bir çarşı dükkanı
   IDEA: eski bir arastada tezgah; tente, çini ve kilim
   PICTURE: low-poly 3D dükkan, krem kağıt paneller içinde
   COLOUR and TYPE: krem, koyu ceviz çizgi, çini yeşili, kiremit; DM Serif Display + Fredoka
   LAYOUT: üstte durum, ortada sahne, altta kalın düğmeler */
:root{--ink:#3b2a1e;--cr:#f4ead5;--cr2:#e9dcc0;--ln:#4a3423;--tl:#2f6b5a;--tlD:#1f4a3e;--tr:#b5533c;--gd:#d9a23a}
html,body{margin:0;height:100%;background:#1f3a33;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
*{box-sizing:border-box}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
#frame{position:relative;margin:0 auto;height:100dvh;width:min(100vw,62dvh);overflow:hidden;background:#2b1d12}
@media(min-width:700px){#frame{height:min(96dvh,860px);margin-top:2dvh;border-radius:28px;width:calc(min(96dvh,860px)*0.56);border:3px solid var(--ln)}}
#c,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}#fx{pointer-events:none}
#ui,#labels{position:absolute;inset:0;pointer-events:none}
#ui button{pointer-events:auto;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 60%,#1a100855 100%)}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.pill{background:var(--cr);border:2px solid var(--ln);box-shadow:0 2px 0 var(--ln);color:var(--ink);border-radius:14px;padding:3px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit}
.pill svg{width:15px;height:15px}
button.pill{cursor:pointer;min-width:34px;justify-content:center}
button.pill.off{opacity:.5;text-decoration:line-through}
#pat{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 43px);height:6px;border-radius:3px;background:#0006;overflow:hidden}
#pat i{display:block;height:100%;width:100%;border-radius:3px;transition:width .25s linear}
#tip{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:50%;transform:translateX(-50%);background:var(--cr);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);border-radius:14px;padding:7px 14px;font-size:15px;text-align:center;width:max-content;max-width:90%;line-height:1.3}
#tip small{display:block;font-size:13px;color:var(--tl)}
.pips{display:flex;gap:4px;justify-content:center;margin-bottom:4px}.pips i{width:14px;height:5px;border-radius:3px;background:#4a342333}.pips i.d{background:var(--tl)}.pips i.c{background:var(--gd)}
#bubble{position:absolute;top:27%;right:6%;max-width:60%;background:var(--cr);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);border-radius:16px;padding:9px 12px;font-size:15px;line-height:1.3;animation:pin .2s ease-out}
#bubble:after{content:"";position:absolute;left:24px;bottom:-16px;border:8px solid transparent;border-top-color:var(--ln)}
#card{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:10px;background:#f4ead5f4;border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);color:var(--ink);border-radius:14px;padding:7px 10px;font-size:13px;line-height:1.45;min-width:150px;max-width:62%;animation:pin .2s ease-out}
#card h4{margin:0 0 2px;font:400 16px 'DM Serif Display',Georgia,serif;color:var(--tl)}
.ok{color:#3f7a2a}.no{color:var(--tr)}.mid{color:#a5700a}
#actions{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 88px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:14px;border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);padding:8px 15px;min-height:46px;cursor:pointer;background:var(--gd);color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn.g{background:var(--tl);color:var(--cr)}
.btn.r{background:var(--tr);color:#fff1e6}
.btn.l{background:var(--cr);color:var(--ink)}
.btn.col{width:50px;height:50px;padding:0;border-radius:50%}
.btn.sel{outline:4px solid var(--gd);outline-offset:2px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ln)}
.btn:disabled{opacity:.45;cursor:default}
#nav{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:6px}
#nav button{flex:1;font:inherit;font-size:12px;font-weight:600;background:var(--cr);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);color:var(--ink);border-radius:15px;padding:6px 0 4px;min-height:60px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s,background .15s}
#nav button svg{width:22px;height:22px;color:var(--tl)}
#nav button.on{background:var(--tl);color:var(--cr)}#nav button.on svg{color:var(--cr)}
#nav button:active{transform:translateY(2px)}
#nav button:disabled{opacity:.5}
#modal{position:absolute;inset:0;background:#1a100899;display:flex;align-items:flex-end;pointer-events:auto;animation:dim .2s}
.sheet{width:100%;background:var(--cr);border-top:3px solid var(--ln);border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);color:var(--ink);max-height:84%;overflow:auto;animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet:before{content:"";display:block;height:10px;margin:-14px -14px 10px;border-radius:20px 20px 0 0;background:repeating-linear-gradient(90deg,var(--tr) 0 18px,var(--cr2) 18px 36px)}
.sheet h3{margin:0 0 2px;font:400 26px 'DM Serif Display',Georgia,serif;color:var(--tl)}
.sheet p{margin:0 0 6px;font-size:14px;opacity:.85}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs .btn{flex:1;min-height:40px;font-size:14px;padding:4px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1.5px dashed #4a342333}
.ic{width:44px;height:44px;border-radius:10px;background:#fffaf0;border:1.5px solid #4a342340;flex:none}
.row .n{flex:1;font-size:15px;line-height:1.2;min-width:0}.row .n small{display:block;opacity:.7;font-size:12px}
.row .btn{padding:3px 11px;min-height:40px;font-size:14px;white-space:nowrap}
.io{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600}
.io img{width:30px;height:30px;border-radius:8px;background:#fffaf0;border:1.5px solid #4a342340}
.arrow{font-size:18px;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.cell{background:#fffaf0;border:1.5px solid #4a342340;border-radius:12px;padding:5px 3px;text-align:center;font-size:11px;line-height:1.15}
.cell img{width:100%;max-width:58px;display:block;margin:0 auto}
.cell b{display:block;font-size:15px}
.cell.zero{opacity:.4}
.grp{font-size:13px;font-weight:600;margin-top:10px;color:var(--tl)}
.stars{font-size:34px;color:var(--gd);letter-spacing:4px;line-height:1}
.stars i{font-style:normal;color:#4a342333}
.brk{display:flex;justify-content:space-between;font-size:15px;padding:4px 0;border-bottom:1px dashed #4a342333}
.tot{font:400 24px 'DM Serif Display',Georgia,serif;margin:10px 0;color:var(--tl)}
.gauge{width:100%;height:24px;border:2px solid var(--ln);border-radius:12px;background:#fffaf0;position:relative;overflow:hidden}
.gz{position:absolute;left:62%;width:24%;top:0;bottom:0;background:#9bd08a}
.gf{position:absolute;left:0;top:0;bottom:0;width:0;background:#d9a23aaa;border-right:3px solid var(--ln)}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--cr);color:var(--ink);border:2px solid var(--ln);box-shadow:0 2px 0 var(--ln);border-radius:10px;padding:3px 8px;font-size:12px;font-weight:600;text-align:center;white-space:nowrap;line-height:1.25}
.lbl small{display:block;font-size:11px;color:var(--tl)}
.lbl.lock{opacity:.6}
.lbl.dn{font-size:9px;font-weight:600;padding:1px 4px;white-space:normal;max-width:56px;line-height:1.1;border-width:1.5px;border-radius:6px;box-shadow:0 1px 0 var(--ln)}.lbl.dn b{font-weight:800;color:var(--tl)}
.lbl.sm,.lbl.stl.sm{font-size:10px;padding:2px 7px;border-width:1.5px;border-radius:8px;box-shadow:0 1px 0 var(--ln);line-height:1.2}.lbl.sm small{font-size:9px}
.lbl.stl{pointer-events:auto;cursor:pointer;font-size:13px;padding:5px 11px;border-radius:12px}
.lbl.rdy{background:var(--tl);color:var(--cr);animation:pulse .7s infinite alternate}.lbl.rdy small{color:#d6f0c8}
.lbl.wat{background:#3f7fa8;color:#eaf6ff;animation:pulse .7s infinite alternate}.lbl.wat small{color:#d4ecff}
@keyframes pulse{to{box-shadow:0 0 0 6px #9bd08a66}}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);background:var(--tl);color:var(--cr);border:2px solid var(--tlD);box-shadow:0 3px 0 var(--tlD);border-radius:14px;padding:10px 18px;font-size:17px;text-align:center;max-width:84%;animation:tin .18s ease-out}
#fade{position:absolute;inset:0;background:#1f3a33;opacity:0;transition:opacity .19s ease;pointer-events:none}
.dt #card{transform:translateY(46px)}
#dtabs{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 56px);display:flex;gap:4px;background:rgba(30,20,12,.62);padding:4px;border-radius:14px;pointer-events:auto;z-index:2}#dtabs button{border:0;border-radius:10px;padding:8px 12px;font:600 13px/1 inherit;font-family:inherit;color:#f3e6cf;background:transparent}#dtabs button.on{background:#e8c77a;color:#2b1d12}
#zones{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);display:flex;gap:4px;background:rgba(30,20,12,.62);padding:4px;border-radius:14px;pointer-events:auto}#zones button{border:0;border-radius:10px;padding:8px 12px;font:600 13px/1 inherit;font-family:inherit;color:#f3e6cf;background:transparent}#zones button.on{background:#e8c77a;color:#2b1d12}
#zoom{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 54px);display:flex;gap:8px}
#zoom button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);background:var(--cr);color:var(--ink);font:600 24px/1 Fredoka,system-ui,sans-serif;cursor:pointer}
#zoom button:active{transform:translateY(2px)}
.flt{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;font-size:20px;font-weight:600;color:#fff6d8;text-shadow:0 2px 0 var(--ln);animation:rise .9s ease-out forwards;pointer-events:none}
.flt img{width:36px;height:36px}
.bar{height:6px;border-radius:3px;background:#4a342322;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--tl)}
input{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:2px solid var(--ln);border-radius:10px;background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
.pk{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.lg{width:48px;height:48px;border-radius:12px;border:2px solid var(--ln);background:#fffaf0;padding:3px;cursor:pointer}.lg img{width:100%;display:block}.lg.sel{outline:4px solid var(--gd);outline-offset:1px}
.cutc{color:var(--tr)}.bonc{color:#3f7a2a}
#splash{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,rgba(43,29,18,.0) 0%,rgba(43,29,18,.0) 34%,rgba(255,247,232,.55) 52%,rgba(255,247,232,.93) 70%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:118px;text-align:center;color:var(--ink);transition:opacity .45s ease,transform .45s ease}
#splash.go{opacity:0;transform:scale(1.04);pointer-events:none}
.awn{position:absolute;left:0;right:0;top:0;height:64px;background:repeating-linear-gradient(90deg,var(--tr) 0 34px,var(--cr2) 34px 68px)}
.awn:after{content:"";position:absolute;left:0;right:0;top:64px;height:17px;background:radial-gradient(circle at 17px 0,var(--tr) 16px,transparent 17px) 0 0/68px 17px,radial-gradient(circle at 51px 0,var(--cr2) 16px,transparent 17px) 0 0/68px 17px}
.rug{position:absolute;left:0;right:0;bottom:0;height:92px;border-top:3px solid var(--ln);background:conic-gradient(from 45deg,var(--tr) 25%,var(--cr2) 0 50%,var(--tl) 0 75%,var(--cr2) 0) 0 0/30px 30px}
.tile{width:94px;height:94px;border-radius:50%;border:3px solid var(--ln);background:#fffaf0;display:grid;place-items:center;margin-bottom:6px}
#splash h1{margin:0;font:400 64px/1 'DM Serif Display',Georgia,serif;color:var(--tl);text-shadow:0 2px 0 #fff8ea}
.spc{display:flex;flex-direction:column;align-items:center;gap:0}.spc .tile{margin-top:-30px;box-shadow:0 4px 0 var(--ln)}#spInfo{font-size:13px;font-weight:700;color:var(--ink);background:#fffaf0;border:2px solid var(--ln);border-radius:12px;padding:5px 12px;margin:-8px 0 14px}#spInfo:empty{display:none}#spNew{margin-top:10px;font-size:15px!important;padding:8px 22px!important}
.spl #zoom{display:none!important}#menuB.warn{position:relative}#menuB.warn:after{content:'';position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;background:#d9534f;border:2px solid #fff8ea}.spl #ui>:not(#splash):not(#modal):not(#toast){visibility:hidden}.ccode{font:700 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:2px;text-align:center;background:#fffaf0;border:2px dashed var(--ln);border-radius:12px;padding:8px;margin-bottom:8px;color:var(--tl)}#spCode{margin-top:10px;background:none;border:0;color:var(--tl);font:700 14px inherit;font-family:inherit;text-decoration:underline}#spCodeBox{display:flex;gap:6px;margin-top:8px}#spCodeBox.hide{display:none}#spCodeIn{width:170px;font:700 16px ui-monospace,Menlo,monospace;text-transform:uppercase;border:2px solid var(--ln);border-radius:10px;padding:6px 8px;background:#fffaf0}#spCodeGo{font-size:15px!important;padding:6px 14px!important}#splash p{text-shadow:0 1px 0 #fff8ea}
.flags{position:absolute;left:0;top:76px;width:100%;height:60px;pointer-events:none}
#splash p{margin:6px 0 22px;font-size:17px;color:var(--tr);font-weight:600}
#splash .btn{font-size:20px;padding:12px 34px}
.spo{display:flex;gap:10px;margin-top:16px}.tg{display:flex;align-items:center;gap:7px;border:2px solid var(--ln);background:#fffaf0;color:var(--ink);border-radius:999px;padding:7px 8px 7px 12px;font:700 15px inherit;font-family:inherit;box-shadow:0 3px 0 var(--ln)}.tg svg{width:18px;height:18px;color:var(--tr)}.tg i{position:relative;width:38px;height:22px;border-radius:11px;background:#cbbba0;transition:background .2s}.tg i:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}.tg.on i{background:var(--tl)}.tg.on i:after{left:19px}.tg:not(.on){opacity:.8}.tg:not(.on) svg{color:#9a8a70}.tg:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ln)}
.spo .btn{font-size:14px;padding:4px 14px;min-height:38px}
@keyframes pin{from{opacity:0;transform:scale(.92)}}
@keyframes up{from{transform:translateY(35%);opacity:.3}}
@keyframes dim{from{background:#0000}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-38%)}}
@keyframes rise{to{transform:translate(-50%,-200%);opacity:0}}
#openB{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 54px);background:var(--tl);color:var(--cr);border-color:var(--tlD);box-shadow:0 2px 0 var(--tlD)}
#openB.cl{background:var(--tr);border-color:#6e2a1c;box-shadow:0 2px 0 #6e2a1c}
.lbl.cnt{padding:0 6px;font-size:12px;border-radius:9px;min-width:22px;box-shadow:0 1px 0 var(--ln)}
#vitB{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 92px)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--tl);height:34px}
.hgv{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0}
.hgv b{font:400 32px 'DM Serif Display',Georgia,serif;min-width:90px;text-align:center;color:var(--tl)}
.hgv .btn{min-height:40px;padding:4px 12px}
.hq{font-size:16px!important;opacity:1!important;font-style:italic}
.hide{display:none!important}
</style>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>
  <canvas id="fx"></canvas>
  <div id="vig"></div>
  <div id="labels"></div>
  <div id="fade"></div>
  <div id="ui">
    <div id="top">
      <div style="display:flex;gap:5px">
        <div class="pill"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#e8a915" stroke="#7a5408" stroke-width="1.5"/><circle cx="8" cy="8" r="3.5" fill="none" stroke="#7a5408" stroke-width="1.2"/></svg><b id="gold">0</b></div>
        <div class="pill"><svg viewBox="0 0 16 16"><path d="M8 1l2.1 4.4 4.8.6-3.5 3.3.9 4.7L8 11.7 3.7 14l.9-4.7L1.1 6l4.8-.6z" fill="#ffcf3a" stroke="#7a5408" stroke-width="1"/></svg><b id="rep">0</b></div>
      </div>
      <div style="display:flex;gap:5px"><div class="pill" id="tierP">K1</div><button class="pill" id="musB" aria-label="Müzik">♪</button><button class="pill" id="menuB" aria-label="Menü">☰</button></div>
    </div>
    <button class="pill hide" id="openB">Açık</button>
    <button class="pill hide" id="vitB">Vitrin</button>
    <div id="pat" class="hide"><i></i></div>
    <div id="card" class="hide"></div>
    <div id="tip" class="hide"></div>
    <div id="bubble" class="hide"></div>
    <div id="actions"></div>
    <div id="nav">
      <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/></svg>Dükkan</button>
      <button data-v="pazar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11L21 7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Pazar</button>
      <button data-v="bahce"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16z"/><path d="M5 21l8-8"/></svg>Bahçe</button>
      <button data-v="islik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12l-2 4H6z"/><path d="M16 9h4l-2 3"/><path d="M9 13v4h2v-4"/><path d="M6 21h10l-1-4H7z"/></svg>Atölye</button>
      <button data-v="depo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v10l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v10"/></svg>Depo</button>
    </div>
    <div id="dtabs" class="hide"><button data-v="depo">Malzemeler</button><button data-v="vitrin">Vitrin</button></div>
    <div id="zones" class="hide"><button data-z="-1">Çiftlik</button><button data-z="0" class="on">Bostan</button><button data-z="1">Orman</button></div>
    <div id="zoom" class="hide"><button id="zi" aria-label="Yakınlaştır">+</button><button id="zo" aria-label="Uzaklaştır">−</button></div>
