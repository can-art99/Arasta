<style>
:root{--ink:#3b2a1e;--cr:#f4ead5;--cr2:#e9dcc0;--ln:#4a3423;--tl:#2f6b5a;--tr:#b5533c;--gd:#d9a23a}
*{box-sizing:border-box}body{margin:0;background:#1f4a3e;font-family:'Baloo 2',sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 90px}

.card{background:var(--cr);border:2px solid var(--ln);border-radius:18px;box-shadow:0 3px 0 var(--ln);padding:12px;margin-bottom:12px}

.row .m{flex:1;min-width:0}.row b{display:block;font-size:14px;line-height:1.25;word-break:break-word}.row small{display:block;font-size:11.5px;opacity:.7}
.pill{font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px;background:#b5533c22;color:#8a3a2a;white-space:nowrap}.pill.ok{background:#2f6b5a22;color:#2f6b5a}.pill.n{background:#d9a23a33;color:#7a5408}
button.b{border:2px solid var(--ln);border-radius:12px;background:#fffaf0;box-shadow:0 2px 0 var(--ln);font:inherit;font-weight:700;font-size:13px;padding:6px 11px;color:var(--ink);cursor:pointer}
button.b.g{background:var(--tl);color:#fff}button.b.r{background:var(--tr);color:#fff}button.b:active{transform:translateY(2px);box-shadow:none}
input,textarea{width:100%;border:2px solid var(--ln);border-radius:12px;padding:9px 10px;font:inherit;background:#fffaf0;color:var(--ink)}
pre{white-space:pre-wrap;word-break:break-word;background:#fffaf0;border-radius:10px;padding:8px;font-size:11px;max-height:260px;overflow:auto;margin:6px 0}
.flt{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.flt button{font-size:12px;padding:4px 10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1.5px dashed #4a342340;font-weight:700}
.sw i{width:44px;height:25px;border-radius:13px;background:var(--tl);position:relative;flex:none}.sw i::after{content:'';position:absolute;right:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff}.sw i.off{background:#b5533c}.sw i.off::after{right:auto;left:3px}
.det{background:#fffaf0;border-radius:12px;padding:8px;margin-top:6px;font-size:12px}
.err{color:#b5533c;font-size:13px;min-height:1em}.muted{opacity:.6;font-size:12.5px;text-align:center;padding:12px}
.tip{font-size:12.5px;background:#fff6dc;border-left:3px solid #d9a441;padding:6px 8px;border-radius:6px;margin:6px 0}.lb{display:flex;flex-direction:column;font-size:11.5px;flex:1;min-width:80px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.bar span{width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar i{display:block;height:14px;border-radius:7px;background:var(--tl);min-width:2px}.bar em{font-style:normal;font-weight:700;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin:8px 0 2px}.cols div{flex:1;background:var(--tl);border-radius:4px 4px 0 0;min-height:2px;position:relative}.cols div b{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px}
.cl{display:flex;gap:3px;font-size:9.5px;opacity:.7}.cl span{flex:1;text-align:center}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.kv div{background:#fffaf0;border-radius:10px;padding:6px;text-align:center;font-size:11px;line-height:1.2}.kv b{display:block;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chips span{background:#e9dcc0;border-radius:8px;padding:1px 7px;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid2 label{font-size:11.5px;display:flex;flex-direction:column}
h4{margin:10px 0 4px;font-size:14px}
</style></head><body><div class="wrap">
<h1>Arasta yönetim <small id="who"></small></h1>
<div id="app"></div></div>
<script>
const U='https://rytrhkpmsfskiyoujyyb.supabase.co/rest/v1/rpc/',A='sb_publishable_I_rw47M8KquQV6XTLm2LYg_KEckXVj7';
let SV={};let KEY=localStorage.getItem('arasta-admin')||'',TAB='err',SHOWRES=false,SHOWDONE=false;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const s=Date.now()/1000-t;return s<90?'az önce':s<3600?Math.round(s/60)+' dk önce':s<86400?Math.round(s/3600)+' sa önce':Math.round(s/86400)+' gün önce'};

function rpc(op,arg){return fetch(U+'arasta_admin',{method:'POST',headers:{apikey:A,'Content-Type':'application/json'},body:JSON.stringify({p_key:KEY,p_op:op,p_arg:arg||{}})}).then(r=>r.json()).then(d=>{if(d&&d.err==='key'){logout('Anahtar geçersiz');throw 'key'}return d})}

 $('#go').onclick=()=>{const v=$('#k').value.trim();if(!v){$('#e').textContent='Anahtarı yaz';return}KEY=v;rpc('summary').then(()=>{localStorage.setItem('arasta-admin',KEY);main()}).catch(()=>{})}}
let SUM={};
function main(){$('#who').innerHTML='<button class="b" id="lo" style="font-size:11px;padding:2px 8px">Çıkış</button>';$('#lo').onclick=()=>logout('');
 rpc('summary').then(s=>{SUM=s;draw()})}
function draw(){const T=[['err','Hatalar',SUM.errors],['rep','Bildirim',SUM.reports],['ply','Oyuncular'],['st','İstatistik'],['eco','Ekonomi'],['den','Denge'],['gift','Hediye'],['cfg','Ayarlar'],['log','Geçmiş']];
 app.innerHTML=`<div class="sum"><div><b>${SUM.errors}</b>açık hata</div><div><b>${SUM.errors24}</b>son 24 sa hata</div><div><b>${SUM.active24}/${SUM.saves}</b>aktif dükkân</div></div>
 <div class="tabs">${T.map(t=>`<button data-t="${t[0]}" class="${TAB===t[0]?'on':''}">${t[1]}${t[2]?' ('+t[2]+')':''}</button>`).join('')}</div><div id="pane"><p class="muted">Yükleniyor…</p></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;draw()});({err:pErr,rep:pRep,ply:pPly,st:pStat,eco:pEco,den:pDen,gift:pGift,cfg:pCfg,log:pLog})[TAB]()}
function tip(e){const m=String(e.msg||''),k=e.kind;
 if(k==='nan')return 'Bir değer bozulmuş. Oyuncunun parası etkilendiyse Oyuncular sekmesinden değerini düzelt ya da hatadan önceki bir yedeğe dön. Kod düzeltmesi için ekran görüntüsünü Claude\'a gönder.';
 if(/is not defined|is not a function|Cannot read|undefined/i.test(m))return 'Kod hatası: bir ekran ya da özellik çöküyor. Ayrıntı\'daki ekran adına bak; o özellik Ayarlar\'da varsa kapat, oyunculara duyuru yap, Claude\'a gönder.';
 if(/fetch|network|Load failed|NetworkError/i.test(m))return 'Bağlantı sorunu, genelde oyuncunun interneti. Çok dükkânda birden çıkmıyorsa çözüldü işaretleyebilirsin.';
 if(/WebGL|context lost|memory/i.test(m))return 'Cihazın grafik belleği yetmemiş. Eski telefonlarda olur; tek dükkânda ise çözüldü işaretle.';
 return 'Kaç dükkânda çıktığına bak. Tek seferlikse bekle; artıyorsa ilgili özelliği kapat ve Claude\'a gönder.'}
function gift(id,codes,all){const b=$('#gf'+id);b.innerHTML=`<div class="det"><div style="display:flex;gap:6px;margin:6px 0;flex-wrap:wrap"><input id="fg${id}" type="number" min="0" placeholder="Altın" style="flex:1"><input id="fe${id}" type="number" min="0" placeholder="Elmas" style="flex:1"></div><input id="fm${id}" placeholder="Oyuncuya mesaj (isteğe bağlı)" maxlength="200"><div style="display:flex;gap:6px;margin-top:6px"><button class="b g" id="fs${id}">Gönder</button><button class="b" id="fc${id}">Vazgeç</button></div><p class="err" id="fr${id}"></p></div>`;
 $('#fc'+id).onclick=()=>b.innerHTML='';
 $('#fs'+id).onclick=()=>{const g=+$('#fg'+id).value||0,e=+$('#fe'+id).value||0,msg=$('#fm'+id).value.trim();if(g<0||e<0||(!g&&!e)){$('#fr'+id).textContent='Altın ya da elmas miktarı gir';return}
  const who=all?'TÜM dükkânlara':codes.length+' dükkâna';if(!confirm(who+' '+g+' altın, '+e+' elmas gönderilsin mi?'))return;
  rpc('bulk_grant',all?{all:true,gold:g,elmas:e,msg}:{codes,gold:g,elmas:e,msg}).then(n=>{$('#fr'+id).style.color='#2f6b5a';$('#fr'+id).textContent=n+' dükkâna gönderildi. Oyuncular oyuna girince görecek.'})}}
function pErr(){rpc('errors').then(L=>{const V=L.filter(e=>SHOWRES||!e.resolved);
 $('#pane').innerHTML=`<div class="flt"><button class="b" id="tr">${SHOWRES?'Çözülenleri gizle':'Çözülenleri de göster'}</button><button class="b" id="rf">Yenile</button></div><div class="card">${V.length?V.map(e=>`<div class="row"><div class="m"><b>${esc(e.msg)}</b><small>${e.kind==='nan'?'Bozuk sayı':e.kind} · ${e.cnt} kez · ${(e.codes||[]).length} dükkân · son ${ago(dt(e.last_at))} · sürüm ${esc(e.ver)}</small><div class="tip">${esc(tip(e))}</div><div id="d${e.id}"></div></div><div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">${e.resolved?'<span class="pill ok">Çözüldü</span>':'<span class="pill">Açık</span>'}<button class="b" data-d="${e.id}">Ayrıntı</button><button class="b ${e.resolved?'':'g'}" data-r="${e.id}" data-v="${!e.resolved}">${e.resolved?'Yeniden aç':'Çözüldü'}</button></div></div>`).join(''):'<p class="muted">Açık hata yok</p>'}</div>`;
 $('#tr').onclick=()=>{SHOWRES=!SHOWRES;pErr()};$('#rf').onclick=main;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rpc('resolve',{id:+b.dataset.r,v:b.dataset.v==='true'}).then(main));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const box=$('#d'+b.dataset.d);if(box.innerHTML){box.innerHTML='';return}rpc('error',{id:+b.dataset.d}).then(e=>{const c=e.ctx||{};box.innerHTML=`<div class="det">Ekran: <b style="display:inline">${esc(c.view)}</b> · aşama ${esc(c.phase)} ${c.pid?'· ürün '+esc(c.pid)+' · adım '+esc(c.step):''}<br>Altın ${esc(c.gold)} · kademe ${esc(c.tier)} · gün ${esc(c.day)} · ekran ${esc(c.w)}<br>İlk görülme: ${new Date(e.first_at).toLocaleString('tr-TR')}<pre>${esc((c.trail||[]).join('\n'))}</pre><pre>${esc(e.stack||'')}</pre><small>${esc(c.ua)}</small><br><small>Dükkânlar: ${esc((e.codes||[]).join(', '))}</small><div style="margin-top:8px"><button class="b g" id="gb_${e.id}">Etkilenenlere hediye gönder</button><div id="gfe${e.id}"></div></div></div>`;$('#gb_'+e.id).onclick=()=>gift('e'+e.id,e.codes||[],false)})})})}
function pRep(){rpc('reports').then(L=>{const V=L.filter(r=>SHOWDONE||!r.done);
 $('#pane').innerHTML=`<div class="flt"><button class="b" id="tr">${SHOWDONE?'Kapananları gizle':'Kapananları da göster'}</button></div><div class="card">${V.length?V.map(r=>{const c=r.ctx||{};return `<div class="row"><div class="m"><b>${esc(r.msg)}</b><small>${ago(dt(r.at))} · ${esc(r.code||'bulut kaydı yok')} · ${esc(c.view)} · ${c.pid?esc(c.pid)+' / '+esc(c.step)+' · ':''}altın ${esc(c.gold)} · sürüm ${esc(c.v)}</small>${(c.trail||[]).length?`<pre>${esc(c.trail.join('\n'))}</pre>`:''}</div><div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">${r.done?'<span class="pill ok">Kapandı</span>':'<span class="pill n">Yeni</span>'}<button class="b ${r.done?'':'g'}" data-x="${r.id}" data-v="${!r.done}">${r.done?'Yeniden aç':'Kapat'}</button></div></div>`}).join(''):'<p class="muted">Yeni bildirim yok</p>'}</div>`;
 $('#tr').onclick=()=>{SHOWDONE=!SHOWDONE;pRep()};document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>rpc('report_done',{id:+b.dataset.x,v:b.dataset.v==='true'}).then(main))})}
function pPly(){rpc('saves').then(L=>{SV={};L.forEach(x=>SV[x.code]=x);$('#pane').innerHTML=`<div class="flt"><button class="b g" id="ga">Tüm dükkânlara hediye</button></div><div id="gfall"></div><input id="q" placeholder="Dükkân adı, kullanıcı ya da kod ara" style="margin:10px 0"><div class="card" id="pl"></div>`;$('#ga').onclick=()=>gift('all',[],true);
 const f=()=>{const q=$('#q').value.toLowerCase().trim();$('#pl').innerHTML=L.filter(s=>!q||[s.ad,s.user,s.code].join(' ').toLowerCase().includes(q)).map(s=>`<div class="row"><div class="m"><b>${esc(s.ad||'(adsız)')}${s.user?' · @'+esc(s.user):''}</b><small>${esc(s.code)} · K${esc(s.tier)} · ${esc(s.day)}. gün · ${esc(s.gold)} altın · ${esc(s.elmas||0)} elmas · ${ago(s.ts)}</small><div id="p${s.code}"></div></div><button class="b" data-p="${s.code}">Aç</button></div>`).join('')||'<p class="muted">Sonuç yok</p>';
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>plOpen(b.dataset.p))};$('#q').oninput=f;if(GOTO){$('#q').value=GOTO;f();const c=GOTO;GOTO='';plOpen(c)}else f()})}
function plDet(F){const d=F.data||{},inv=Object.entries(d.inv||{}).filter(e=>+e[1]>0),cat=Object.entries(d.cat||{}).sort((a,b)=>(b[1].n||0)-(a[1].n||0)),st=d.st||{},ach=Object.keys(d.ach||{}).length,own=[d.cirak&&'Çırak',d.trak&&'Traktör',d.coban&&'Çoban',d.sigorta>Date.now()&&'Sigorta'].filter(Boolean);
 return `<div class="det"><b style="display:inline">Dükkân ayrıntısı</b>${F.user?' · @'+esc(F.user):''}<div class="kv"><div><b>${fmt(d.gold)}</b>altın</div><div><b>${fmt(d.elmas)}</b>elmas</div><div><b>${fmt(d.rep)}</b>itibar</div><div><b>K${esc(d.tier)}</b>${esc(d.day)}. gün</div><div><b>${F.days}</b>aktif gün</div><div><b>${ach}</b>başarım</div><div><b>${fmt(st.deliv)}</b>teslim</div><div><b>${fmt(st.sold)}</b>raf satışı</div><div><b>${fmt(st.earned)}</b>toplam kazanç</div></div>
 <h4>Sahip oldukları</h4><div class="chips">${own.length?own.map(o=>`<span>${o}</span>`).join(''):'<span>Henüz yok</span>'}${d.land?`<span>${d.land} ek tarla</span>`:''}</div>
 <h4>Envanter</h4><div class="chips">${inv.length?inv.map(([k,v])=>`<span>${esc(k)} ×${fmt(v)}</span>`).join(''):'<span>Boş</span>'}</div>
 <h4>Ürettikleri</h4><div class="chips">${cat.length?cat.map(([k,v])=>`<span>${esc(pn(k))} ×${v.n||0}${v.best?' · '+v.best+'★':''}</span>`).join(''):'<span>Henüz yok</span>'}</div>
 ${(F.errors||[]).length?`<h4>Yaşadığı hatalar</h4>${F.errors.map(e=>`<small style="display:block">${esc(e.msg)} · ${e.cnt} kez · ${ago(e.at)}</small>`).join('')}`:''}
 ${(F.reports||[]).length?`<h4>Bildirimleri</h4>${F.reports.map(r=>`<small style="display:block">“${esc(r.msg)}” · ${ago(r.at)}</small>`).join('')}`:''}
 ${(F.audit||[]).length?`<h4>Panelden yapılanlar</h4>${F.audit.map(a=>`<small style="display:block">${esc(OPN[a.op]||a.op)} · ${auditTxt(a)} · ${ago(a.at)}</small>`).join('')}`:''}
 <small style="display:block;margin-top:6px">Son kayıt: ${ago(F.ts)}</small></div>`}
function plOpen(code){const box=$('#p'+code);if(!box)return;if(box.innerHTML){box.innerHTML='';return}Promise.all([rpc('hist',{code}),rpc('save_full',{code})]).then(([H,F])=>{
 const sv=SV[code]||{};box.innerHTML=(F?plDet(F):'')+`<div class="det"><b style="display:inline">Değerleri ayarla</b><div style="display:flex;gap:6px;margin:6px 0;flex-wrap:wrap"><label class="lb">Altın<input id="sg${code}" type="number" min="0" value="${esc(sv.gold||0)}"></label><label class="lb">Elmas<input id="se${code}" type="number" min="0" value="${esc(sv.elmas||0)}"></label><label class="lb">İtibar<input id="sr${code}" type="number" min="0" value="${esc(sv.rep||0)}"></label></div><input id="sm${code}" placeholder="Oyuncuya mesaj (isteğe bağlı)" maxlength="200"><div style="margin:6px 0 2px"><button class="b g" id="sb${code}">Ayarla</button></div><p class="err" id="ser${code}"></p>
 <b style="display:inline">Tazmin et (üstüne ekle)</b><div style="display:flex;gap:6px;margin:6px 0"><input id="gg${code}" type="number" placeholder="Altın" min="0"><input id="ge${code}" type="number" placeholder="Elmas" min="0"><button class="b g" id="gb${code}">Ver</button></div><p class="err" id="ger${code}"></p>
 <b style="display:inline">Kayıt yedekleri</b>${H.length?H.map(h=>`<div class="row"><div class="m"><small style="opacity:1">${new Date(h.at*1000).toLocaleString('tr-TR')} · ${ago(h.at)}</small><small>K${esc(h.tier)} · ${esc(h.day)}. gün · ${esc(h.gold)} altın · ${esc(h.elmas||0)} elmas</small></div><button class="b r" data-h="${h.id}">Geri yükle</button></div>`).join(''):'<p class="muted">Henüz yedek yok. Dükkân kaydı değiştikçe birikir.</p>'}</div>`;
 $('#sb'+code).onclick=()=>{const a={code,gold:+$('#sg'+code).value,elmas:+$('#se'+code).value,rep:+$('#sr'+code).value,msg:$('#sm'+code).value.trim()};if([a.gold,a.elmas,a.rep].some(v=>!Number.isFinite(v)||v<0)){$('#ser'+code).textContent='Geçerli sayılar gir';return}if(!confirm(code+' dükkânı: '+a.gold+' altın, '+a.elmas+' elmas, '+a.rep+' itibar olarak ayarlansın mı?'))return;rpc('set',a).then(ok=>{$('#ser'+code).style.color=ok?'#2f6b5a':'';$('#ser'+code).textContent=ok?'Ayarlandı. Oyuncu oyuna girince görecek.':'Olmadı';Object.assign(SV[code]||{},a)})};
 $('#gb'+code).onclick=()=>{const g=+$('#gg'+code).value||0,e=+$('#ge'+code).value||0;if(g<0||e<0||(!g&&!e)){$('#ger'+code).textContent='Altın ya da elmas miktarı gir';return}if(!confirm(code+' dükkânına '+g+' altın, '+e+' elmas verilsin mi?'))return;rpc('grant',{code,gold:g,elmas:e,msg:($('#sm'+code).value||'').trim()}).then(ok=>{$('#ger'+code).textContent=ok?'Verildi. Oyuncu oyuna girince görecek.':'Olmadı';$('#ger'+code).style.color=ok?'#2f6b5a':''})};
 box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{if(!confirm('Dükkân bu yedeğe geri döndürülsün mü? Sonraki ilerleme silinir.'))return;rpc('restore',{code,id:+b.dataset.h}).then(ok=>{alert(ok?'Geri yüklendi. Oyuncu oyuna girince güncel hali yüklenecek.':'Olmadı');main()})})})}
const PRODLIST=/*PRODLIST*/[];const PN=Object.fromEntries(PRODLIST);const pn=id=>PN[id]||id;
const OPN={restore:'Yedek geri yükleme',grant:'Tazmin',bulk_grant:'Toplu hediye',set:'Değer ayarlama',flag_set:'Ayar değişikliği',gift_new:'Hediye kodu oluşturma',gift_del:'Hediye kodu silme'};
const fmt=n=>Number(n||0).toLocaleString('tr-TR');
function bars(o,lab){const E=Object.entries(o||{});const mx=Math.max(1,...E.map(e=>+e[1]));return E.length?E.map(([k,v])=>`<div class="bar"><span>${esc(lab?lab(k):k)}</span><i style="width:${Math.max(1,v/mx*60)}%"></i><em>${fmt(v)}</em></div>`).join(''):'<p class="muted">Veri yok</p>'}
function pStat(){rpc('stats').then(S=>{const D=S.daily||[],mx=Math.max(1,...D.map(d=>d.n));
 $('#pane').innerHTML=`<div class="card"><b>Günlük aktif dükkân</b><small style="display:block;opacity:.7">Son 14 gün. Sayım 19 Kasım'dan beri tam; öncesi eksik olabilir.</small><div class="cols">${D.map(d=>`<div style="height:${d.n/mx*100}%"><b>${d.n||''}</b></div>`).join('')}</div><div class="cl">${D.map((d,i)=>`<span>${i%2?'':String(d.d).slice(8,10)}</span>`).join('')}</div></div>
 <div class="card"><b>Genel</b><div class="kv"><div><b>${S.avgTier}</b>ort. kademe</div><div><b>${S.avgDay}</b>ort. gün</div><div><b>${fmt(S.deliv)}</b>teslim</div><div><b>${fmt(S.sold)}</b>raf satışı</div><div><b>${fmt(S.lost)}</b>kaçan müşteri</div><div><b>${S.owned.cirak}/${S.owned.trak}/${S.owned.coban}</b>çırak/traktör/çoban</div></div></div>
 <div class="card"><b>Kademe dağılımı</b>${bars(S.tiers,k=>'Kademe '+k)}<h4>Bırakanlar (3+ gündür girmeyen)</h4><small style="display:block;opacity:.7;margin-bottom:4px">Hangi kademede takıldıklarını gösterir.</small>${bars(S.quit,k=>'Kademe '+k)}</div>
 <div class="card"><b>En çok yapılan ürünler</b>${bars(Object.fromEntries((S.prods||[]).map(p=>[p.id,p.n])),pn)}</div>`})}
function pEco(){rpc('econ').then(E=>{
 $('#pane').innerHTML=`<div class="card"><b>Dolaşım</b><div class="kv"><div><b>${fmt(E.gold)}</b>toplam altın</div><div><b>${fmt(E.elmas)}</b>toplam elmas</div><div><b>${fmt(E.earned)}</b>toplam kazanılan</div></div></div>
 <div class="card"><b>Şüpheli dükkânlar</b><small style="display:block;opacity:.7">Kısa sürede çok altın/elmas kazanan ya da aşırı yüksek değerli dükkânlar. Senin tazminlerin de burada görünebilir.</small>${(E.anom||[]).length?E.anom.map(a=>`<div class="row"><div class="m"><b>${esc(a.ad||'(adsız)')} · ${esc(a.why)}</b><small>${esc(a.code)} · ${fmt(a.gold)} altın · ${fmt(a.elmas)} elmas${a.hrs!=null?` · son ${a.hrs} saatte ${a.dg>=0?'+':''}${fmt(a.dg)} altın, ${a.de>=0?'+':''}${fmt(a.de)} elmas`:''}</small></div><button class="b" data-go="${esc(a.code)}">Aç</button></div>`).join(''):'<p class="muted">Şüpheli bir şey yok</p>'}</div>
 <div class="card"><b>En zengin 10 dükkân</b>${(E.rich||[]).map((r,i)=>`<div class="row"><div class="m"><b>${i+1}. ${esc(r.ad||'(adsız)')}</b><small>${esc(r.code)} · K${esc(r.tier)} · ${esc(r.day)}. gün · ${fmt(r.gold)} altın · ${fmt(r.elmas)} elmas · toplam kazanç ${fmt(r.earned)}</small></div><button class="b" data-go="${esc(r.code)}">Aç</button></div>`).join('')}</div>`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{GOTO=b.dataset.go;TAB='ply';draw()})})}
let GOTO='';
function pDen(){rpc('flags').then(F=>{const b=F.bal||{},c=b.cost||{},pm=b.prod||{},e=F.event||{},on=e.until>Date.now();
 $('#pane').innerHTML=`<div class="card"><b>Etkinlik</b><p style="font-size:12.5px;margin:2px 0 6px">${on?`<span class="pill ok">Sürüyor</span> ${esc(e.title||'')} · ${new Date(e.until).toLocaleString('tr-TR')} tarihine kadar`:'Şu an etkinlik yok.'} Oyuncular girince bir kez bildirim görür.</p>
 <input id="et" placeholder="Etkinlik adı (örn. Hafta sonu bereketi)" value="${esc(e.title||'')}" style="margin-bottom:6px"><div class="grid2"><label>Satış çarpanı<input id="es" type="number" step="0.1" min="0.1" value="${esc(e.sell||2)}"></label><label>Elmas şansı çarpanı<input id="eg" type="number" step="0.1" min="0.1" value="${esc(e.gem||1)}"></label><label>Süre (saat)<input id="eh" type="number" min="1" value="48"></label></div>
 <div style="display:flex;gap:6px;margin-top:8px"><button class="b g" id="eb">Başlat</button>${on?'<button class="b r" id="ex">Bitir</button>':''}</div><p class="err" id="ee"></p></div>
 <div class="card"><b>Kalıcı denge</b><p style="font-size:12.5px;margin:2px 0 6px">1 = normal. Örn. satış 1.2 → tüm siparişler %20 daha çok öder. Oyuncular 10 dakika içinde görür; yeni gelen müşterilerden itibaren geçerli.</p>
 <div class="grid2"><label>Satış çarpanı<input id="bs" type="number" step="0.05" min="0.1" value="${esc(b.sell||1)}"></label><label>Elmas şansı çarpanı<input id="bg" type="number" step="0.1" min="0.1" value="${esc(b.gem||1)}"></label><label>Çırak (elmas)<input id="cc" type="number" min="1" placeholder="100" value="${esc(c.cirak||'')}"></label><label>Traktör (elmas)<input id="ct" type="number" min="1" placeholder="200" value="${esc(c.trak||'')}"></label><label>Çoban (elmas)<input id="co" type="number" min="1" placeholder="150" value="${esc(c.coban||'')}"></label></div>
 <h4>Ürün bazında fiyat çarpanı</h4><small style="display:block;opacity:.7;margin-bottom:6px">Boş = 1. Çok az satılan ürünü cazip yapmak için 1.3 gibi bir değer ver.</small>
 <input id="pf" placeholder="Ürün ara" style="margin-bottom:6px"><div id="pl2" style="max-height:340px;overflow:auto">${PRODLIST.map(([id,ad])=>`<div class="bar" data-pr="${id}"><span style="width:auto;flex:1">${esc(ad)}</span><input data-pm="${id}" type="number" step="0.05" min="0.1" placeholder="1" value="${esc(pm[id]||'')}" style="width:80px;padding:5px 8px"></div>`).join('')}</div>
 <div style="margin-top:8px"><button class="b g" id="bb">Kaydet</button></div><p class="err" id="be"></p></div>`;
 $('#pf').oninput=()=>{const q=$('#pf').value.toLowerCase();document.querySelectorAll('[data-pr]').forEach(r=>r.style.display=pn(r.dataset.pr).toLowerCase().includes(q)?'':'none')};
 const num=(id,min)=>{const v=parseFloat($(id).value);return Number.isFinite(v)&&v>=min?v:null};
 $('#eb').onclick=()=>{const sl=num('#es',0.1)||1,gm=num('#eg',0.1)||1,h=num('#eh',1);if(!h){$('#ee').textContent='Süreyi saat olarak yaz';return}if(sl>5||gm>10){$('#ee').textContent='Çarpan çok yüksek (satış en fazla 5, elmas en fazla 10)';return}
  if(!confirm(`Etkinlik başlasın mı? Satış ×${sl}, elmas ×${gm}, ${h} saat`))return;rpc('flag_set',{k:'event',v:{id:Date.now(),title:$('#et').value.trim()||'Etkinlik',sell:sl,gem:gm,until:Date.now()+h*3600000}}).then(pDen)};
 if($('#ex'))$('#ex').onclick=()=>{if(confirm('Etkinlik bitirilsin mi?'))rpc('flag_set',{k:'event',v:null}).then(pDen)};
 $('#bb').onclick=()=>{const v={sell:num('#bs',0.1)||1,gem:num('#bg',0.1)||1,cost:{},prod:{}};if(v.sell>5||v.gem>10){$('#be').textContent='Çarpan çok yüksek';return}
  [['cirak','#cc'],['trak','#ct'],['coban','#co']].forEach(([k,i])=>{const x=num(i,1);if(x)v.cost[k]=Math.round(x)});
  document.querySelectorAll('[data-pm]').forEach(i=>{const x=parseFloat(i.value);if(Number.isFinite(x)&&x>0&&x!==1)v.prod[i.dataset.pm]=Math.min(5,x)});
  rpc('flag_set',{k:'bal',v}).then(()=>{$('#be').style.color='#2f6b5a';$('#be').textContent='Kaydedildi'})}})}
function pGift(){rpc('gifts').then(L=>{
 $('#pane').innerHTML=`<div class="card"><b>Yeni hediye kodu</b><p style="font-size:12.5px;margin:2px 0 6px">Oyuncular Ayarlar → Hediye kodu'ndan girer. Her oyuncu bir kodu bir kez kullanabilir.</p>
 <div class="grid2"><label>Kod<input id="gc" placeholder="ARASTA50" maxlength="20" style="text-transform:uppercase"></label><label>Not (oyuncu görür)<input id="gn" placeholder="Hoş geldin hediyesi" maxlength="120"></label><label>Altın<input id="gg" type="number" min="0"></label><label>Elmas<input id="ge" type="number" min="0"></label><label>Kullanım sınırı<input id="gm" type="number" min="0" placeholder="Sınırsız"></label><label>Geçerlilik (gün)<input id="gd" type="number" min="0" placeholder="Süresiz"></label></div>
 <div style="margin-top:8px"><button class="b g" id="gs">Oluştur</button></div><p class="err" id="gr"></p></div>
 <div class="card"><b>Kodlar</b>${L.length?L.map(g=>{const exp=g.until&&new Date(g.until)<new Date(),full=g.max_uses&&g.uses>=g.max_uses;return `<div class="row"><div class="m"><b>${esc(g.code)} ${exp?'<span class="pill">Süresi doldu</span>':full?'<span class="pill">Doldu</span>':'<span class="pill ok">Aktif</span>'}</b><small>${g.gold?fmt(g.gold)+' altın ':''}${g.elmas?fmt(g.elmas)+' elmas ':''}· ${g.uses}${g.max_uses?'/'+g.max_uses:''} kullanım${g.until?' · son '+new Date(g.until).toLocaleDateString('tr-TR'):''}${g.note?' · '+esc(g.note):''}</small></div><button class="b r" data-gd="${esc(g.code)}">Sil</button></div>`}).join(''):'<p class="muted">Henüz kod yok</p>'}</div>`;
 $('#gs').onclick=()=>{const code=$('#gc').value.toUpperCase().replace(/[^A-Z0-9]/g,''),g=+$('#gg').value||0,e=+$('#ge').value||0,m=+$('#gm').value||0,d=+$('#gd').value||0;
  if(code.length<3){$('#gr').textContent='Kod en az 3 harf/rakam olsun';return}if(!g&&!e){$('#gr').textContent='Altın ya da elmas yaz';return}if(g<0||e<0){$('#gr').textContent='Eksi değer olmaz';return}
  rpc('gift_new',{gift:code,gold:g,elmas:e,max:m||null,until:d?new Date(Date.now()+d*86400000).toISOString():null,note:$('#gn').value.trim()}).then(ok=>{if(!ok){$('#gr').textContent='Bu kod zaten var';return}pGift()})};
 document.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{if(confirm(b.dataset.gd+' kodu silinsin mi?'))rpc('gift_del',{gift:b.dataset.gd}).then(pGift)})})}
function auditTxt(a){const x=a.arg||{};switch(a.op){case 'grant':return `${esc(x.code)} · +${fmt(x.gold)} altın, +${fmt(x.elmas)} elmas`;case 'bulk_grant':return `${x.all?'Tüm dükkânlar':(x.codes||[]).length+' dükkân'} · +${fmt(x.gold)} altın, +${fmt(x.elmas)} elmas`;case 'set':return `${esc(x.code)} → ${fmt(x.gold)} altın, ${fmt(x.elmas)} elmas, ${fmt(x.rep)} itibar`;case 'restore':return `${esc(x.code)} · yedek #${esc(x.id)}`;
 case 'flag_set':return ({off:'Özellik aç/kapat',notice:'Duyuru',maint:'Bakım modu',event:'Etkinlik',bal:'Denge ayarları'}[x.k]||esc(x.k))+(x.k==='maint'?(x.v&&x.v.on?' · açıldı':' · kapatıldı'):x.k==='event'?(x.v?' · '+esc(x.v.title):' · bitirildi'):x.k==='off'?' · kapalı: '+esc((x.v||[]).join(', ')||'yok'):'');
 case 'gift_new':return `${esc(x.gift)} · ${fmt(x.gold)} altın, ${fmt(x.elmas)} elmas`;case 'gift_del':return esc(x.gift);default:return ''}}
function pLog(){rpc('audit').then(L=>{$('#pane').innerHTML=`<div class="card"><b>İşlem geçmişi</b><small style="display:block;opacity:.7">Panelden yapılan her değişiklik. Son 200 işlem.</small>${L.length?L.map(a=>`<div class="row"><div class="m"><b>${esc(OPN[a.op]||a.op)}</b><small>${new Date(a.at*1000).toLocaleString('tr-TR')} · ${auditTxt(a)}${a.arg&&a.arg.msg?' · mesaj: “'+esc(a.arg.msg)+'”':''}</small></div></div>`).join(''):'<p class="muted">Henüz işlem yok</p>'}</div>`})}
const FEAT=[['mezat','Mezat'],['takas','Takas'],['bit','Bit pazarı'],['tamir','Tamir ve müşteri tamirleri'],['usta','Usta müşteri çağırma'],['coban','Çoban'],['tarla','Yeni Tarla tapusu'],['dekor','Dekorcu']];
function pCfg(){rpc('flags').then(F=>{const off=Array.isArray(F.off)?F.off:[],n=F.notice||{};
 const mt=F.maint||{};$('#pane').innerHTML=`<div class="card"><b>Bakım modu</b><p style="font-size:12.5px;margin:2px 0 6px">Açınca tüm oyuncular "kısa bakım" ekranı görür ve oynayamaz (sen dükkân sahibi olarak etkilenmezsin). Oyuncular 10 dakika içinde, yeni girenler hemen görür.</p><textarea id="mx" rows="2" placeholder="Bakım mesajı (isteğe bağlı)">${esc(mt.text||'')}</textarea><div class="sw" id="mo" style="border:0"><span>${mt.on?'Bakım AÇIK':'Bakım kapalı'}</span><i class="${mt.on?'off':''}"></i></div></div><div class="card"><b>Özellikler</b><p style="font-size:12.5px;margin:2px 0 6px">Sorunlu bir özelliği yeni sürüm yayınlamadan kapat. Oyuncular 10 dakika içinde görür.</p>${FEAT.map(f=>`<div class="sw" data-f="${f[0]}"><span>${f[1]}</span><i class="${off.includes(f[0])?'off':''}"></i></div>`).join('')}</div>
 <div class="card"><b>Duyuru</b><p style="font-size:12.5px;margin:2px 0 6px">Oyuncular oyuna girince bir kez görür.</p><input id="nt" placeholder="Başlık" value="${esc(n.title||'')}" style="margin-bottom:6px"><textarea id="nx" rows="4" placeholder="Duyuru metni">${esc(n.text||'')}</textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="b g" id="ns">Yayınla</button><button class="b" id="nd">Kaldır</button></div><p class="err" id="ne"></p></div>`;
 $('#mo').onclick=()=>{const on=!mt.on;if(!confirm(on?'Bakım modu açılsın mı? Oyuncular oynayamayacak.':'Bakım modu kapatılsın mı?'))return;rpc('flag_set',{k:'maint',v:{on,text:$('#mx').value.trim()}}).then(pCfg)};
 document.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{const k=r.dataset.f,o=off.includes(k)?off.filter(x=>x!==k):off.concat(k);rpc('flag_set',{k:'off',v:o}).then(pCfg)});
 $('#ns').onclick=()=>{const t=$('#nt').value.trim(),x=$('#nx').value.trim();if(!x){$('#ne').textContent='Duyuru metnini yaz';return}rpc('flag_set',{k:'notice',v:{id:Date.now(),title:t||'Duyuru',text:x}}).then(()=>{$('#ne').style.color='#2f6b5a';$('#ne').textContent='Yayınlandı'})};
 $('#nd').onclick=()=>rpc('flag_set',{k:'notice',v:null}).then(pCfg)})}
KEY?main():login('');
</script></body></html>
